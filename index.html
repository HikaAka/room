<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>HIKARU HOME</title>

<link rel="stylesheet"
      href="style.css">

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

</head>

<body>

<div class="title">
    HIKARU HOME
</div>

<!-- MQTT -->
<div class="card">

    MQTT

    <span
        id="mqttStatus"
        class="statusOff">

        ● Disconnected

    </span>

</div>

<div class="card">

    <div class="cardTitle">
        🌤 Pressure
    </div>

    <div
        class="bigValue"
        id="pressureValue">

        ----

    </div>

    <div>
        hPa
    </div>

</div>
      


<!-- Sensor -->

<div class="card">

    <div class="cardTitle">
        🌡 Temperature
    </div>

    <div
        class="bigValue"
        id="tempValue">

        --.-

    </div>

</div>


<div class="card">

    <div class="cardTitle">
        💧 Humidity
    </div>

    <div
        class="bigValue"
        id="humidityValue">

        ---

    </div>

</div>


<div class="card">

    <div class="cardTitle">
        🫁 CO₂
    </div>

    <div
        class="bigValue"
        id="co2Value">

        ---

    </div>

</div>


<!-- Aircon -->

<div class="card">

    <div class="cardTitle">
        ❄️ AIRCON
    </div>

    <p>
        Mode :
        <span id="airconMode">OFF</span>
    </p>

    <p>
        Temp :
        <span id="airconTemp">26</span>℃
    </p>

    <button onclick="tempDown()">-</button>
    <button onclick="tempUp()">+</button>

    <br><br>

    <button class="coolBtn" onclick="setAirconMode('COOL')">COOL</button>
    <button class="heatBtn" onclick="setAirconMode('HEAT')">HEAT</button>
    <button class="offBtn" onclick="setAirconMode('OFF')">OFF</button>

    <h3>Fan</h3>

    <button onclick="setAirconFan('AUTO')">AUTO</button>
    <button onclick="setAirconFan('LOW')">LOW</button>
    <button onclick="setAirconFan('MED')">MED</button>
    <button onclick="setAirconFan('HIGH')">HIGH</button>
    <button onclick="setAirconFan('MAX')">MAX</button>

    <h3>Swing V</h3>

    <button onclick="setSwingV('AUTO')">AUTO</button>
    <button onclick="setSwingV('UP')">UP</button>
    <button onclick="setSwingV('MID')">MID</button>
    <button onclick="setSwingV('DOWN')">DOWN</button>
    <button onclick="setSwingV('STOP')">STOP</button>

    <h3>Swing H</h3>

    <button onclick="setSwingH('AUTO')">AUTO</button>
    <button onclick="setSwingH('LEFT')">LEFT</button>
    <button onclick="setSwingH('CENTER')">CENTER</button>
    <button onclick="setSwingH('RIGHT')">RIGHT</button>
    <button onclick="setSwingH('STOP')">STOP</button>

    <h3>Options</h3>

    <button onclick="toggleWarp()">WARP</button>
    <button onclick="toggleBio()">BIO</button>

    <br><br>

    <button class="applyBtn" onclick="applyAircon()">
        APPLY
    </button>

</div>

<!-- Light -->

<div class="card">

    <div class="cardTitle">
        💡 LIGHT
    </div>

    <p>
        Power :
        <span id="lightPower">
            OFF
        </span>
    </p>

    <p>
        Brightness :
        <span id="lightBrightness">
            MAX
        </span>
    </p>

    <p>
        Timer :
        <span id="lightTimer">
            OFF
        </span>
    </p>

    <button
        class="lightBtn"
        onclick="lightAllOn()">

        ON

    </button>

    <button
        class="offBtn"
        onclick="lightOff()">

        OFF

    </button>

    <button
        class="lightBtn"
        onclick="lightNight()">

        NIGHT

    </button>

    <button
        class="lightBtn"
        onclick="lightDim()">

        DIM

    </button>

    <button
        class="lightBtn"
        onclick="lightTimer()">

        TIMER

    </button>

</div>

<script src="app.js"></script>

</body>
</html>
